version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: manifestme
      POSTGRES_USER: manifestme
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  web:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://manifestme:password@db:5432/manifestme
      PORT: 4000
      JWT_SECRET: localdevsecret
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  db-data:
