name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-20.04, macos-11.0, windows-2019]
        nodeVersion: [14, 16, 18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js ${{ matrix.nodeVersion }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.nodeVersion }}

      - name: Install dependencies
        run: npm install --unsafe-perm

      - name: Test
        run: npm test

      - name: Package bcrypt
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/master')
        run: npx node-pre-gyp package --unsafe-perm

      - name: Upload bcrypt artifact
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/master')
        uses: actions/upload-artifact@v3
        with:
          name: bcrypt-lib-${{ matrix.os }}-${{ matrix.nodeVersion }}
          path: build/stage/**/bcrypt_lib*.tar.gz

  # Optional: build on Amazon Linux 2 container for EB compatibility
  build-amazonlinux:
    runs-on: ubuntu-latest
    container:
      image: amazonlinux:2
    strategy:
      matrix:
        nodeVersion: [14, 16, 18, 20, 22]
    steps:
      - uses: actions/checkout@v3

      - name: Install system dependencies
        run: |
          yum install -y gcc-c++ make python3

      - name: Setup Node.js ${{ matrix.nodeVersion }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.nodeVersion }}

      - name: Install dependencies
        run: npm install --unsafe-perm

      - name: Test
        run: npm test --unsafe-perm

      - name: Package bcrypt
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/master')
        run: npx node-pre-gyp package --unsafe-perm

      - name: Upload bcrypt artifact
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/master')
        uses: actions/upload-artifact@v3
        with:
          name: bcrypt-lib-amazonlinux-${{ matrix.nodeVersion }}
          path: build/stage/**/bcrypt_lib*.tar.gz
