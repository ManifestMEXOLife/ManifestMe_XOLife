name: Post-Deploy Smoke Test

# Trigger manually or after deployment workflows
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run smoke test against'
        required: true
        type: choice
        options:
          - staging
          - production

  workflow_run:
    workflows: ["deploy-production", "deploy-staging"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '22'
  AWS_REGION: 'us-east-1'
  EB_APP_NAME: 'manifestme-api'
  STAGING_ENV: 'manifestme-staging'
  PRODUCTION_ENV: 'manifestme-env'
  MAX_HEALTH_RETRIES: 60
  HEALTH_SLEEP: 15
  MAX_SMOKE_RETRIES: 5
  SMOKE_SLEEP: 10

jobs:
  smoke:
    name: Run Post-Deploy Smoke Test
    runs-on: ubuntu-latest

    steps:
      # ---------------------------
      # 1️⃣ Checkout code
      # ---------------------------
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      # ---------------------------
      # 2️⃣ Configure AWS Credentials
      # ---------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ---------------------------
      # 3️⃣ Determine Environment URL
      # ---------------------------
      - name: Determine Environment URL
        id: env-url
        run: |
          if [ "${{ github.event.inputs.environment }}" == "staging" ]; then
            EB_ENV_NAME=${{ env.STAGING_ENV }}
          else
            EB_ENV_NAME=${{ env.PRODUCTION_ENV }}
          fi

          echo "Fetching CNAME for environment: $EB_ENV_NAME"
          CNAME=$(aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENV_NAME" \
            --query 'Environments[0].CNAME' \
            --output text)

          if [ -z "$CNAME" ] || [ "$CNAME" = "None" ]; then
            echo "❌ Could not fetch CNAME for $EB_ENV_NAME"
            exit 1
          fi

          echo "TARGET_URL=https://$CNAME" >> $GITHUB_ENV
          echo "Environment URL: https://$CNAME"

      # ---------------------------
      # 4️⃣ Wait for Environment to be Healthy (Retry-Friendly)
      # ---------------------------
      - name: Wait for Environment to be Healthy
        run: |
          EB_ENV_NAME="${{ github.event.inputs.environment == 'staging' && env.STAGING_ENV || env.PRODUCTION_ENV }}"
          echo "⏳ Waiting for $EB_ENV_NAME to become healthy..."
          SUCCESS=0

          for i in $(seq 1 ${{ env.MAX_HEALTH_RETRIES }}); do
            STATUS=$(aws elasticbeanstalk describe-environments \
              --environment-names "$EB_ENV_NAME" \
              --query 'Environments[0].Health' \
              --output text)
            echo "Attempt $i: Environment health = $STATUS"

            if [ "$STATUS" == "Green" ]; then
              echo "✅ Environment is healthy!"
              SUCCESS=1
              break
            fi

            # Exponential backoff to avoid hammering AWS API
            SLEEP_TIME=$(( ${{ env.HEALTH_SLEEP }} * i ))
            echo "⏳ Sleeping $SLEEP_TIME seconds before next health check..."
            sleep $SLEEP_TIME
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "❌ Environment did not become healthy after $(( ${{ env.MAX_HEALTH_RETRIES }} * ${{ env.HEALTH_SLEEP }} )) seconds"
            exit 1
          fi

      # ---------------------------
      # 5️⃣ Run Smoke Test with Retries
      # ---------------------------
      - name: Run Smoke Test
        env:
          TARGET_URL: ${{ env.TARGET_URL }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: |
          echo "🏁 Starting smoke test against $TARGET_URL"
          SUCCESS=0

          for i in $(seq 1 ${{ env.MAX_SMOKE_RETRIES }}); do
            if node scripts/post_deploy_smoke.js; then
              echo "✅ Smoke test passed on attempt $i"
              SUCCESS=1
              break
            else
              echo "⚠️ Smoke test failed on attempt $i. Retrying in ${{ env.SMOKE_SLEEP }}s..."
              sleep ${{ env.SMOKE_SLEEP }}
            fi
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "❌ Smoke test failed after ${{ env.MAX_SMOKE_RETRIES }} attempts"
            exit 1
          fi
