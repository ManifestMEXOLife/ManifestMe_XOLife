name: Manual Smoke Test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to run smoke test against (e.g. https://example.com)'
        required: true
        type: string

jobs:
  smoke:
    name: Run post-deploy smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps
        run: npm ci

      - name: Run smoke script
        env:
          TARGET_URL: ${{ inputs.target_url }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: |
          node scripts/post_deploy_smoke.js
