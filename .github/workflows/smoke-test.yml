name: Post-Deploy Smoke Test

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run smoke test against'
        required: true
        type: choice
        options:
          - staging
          - production

  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '22'
  AWS_REGION: 'us-east-1'
  EB_APP_NAME: 'manifestme-api'
  STAGING_ENV: 'manifestme-staging'
  PRODUCTION_ENV: 'manifestme-env'

jobs:
  smoke:
    name: Run Post-Deploy Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine environment URL
        id: env-url
        run: |
          if [ "${{ github.event.inputs.environment }}" == "staging" ]; then
            EB_ENV_NAME=${{ env.STAGING_ENV }}
          else
            EB_ENV_NAME=${{ env.PRODUCTION_ENV }}
          fi
          echo "Fetching CNAME for environment: $EB_ENV_NAME"
          CNAME=$(aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENV_NAME" \
            --query 'Environments[0].CNAME' \
            --output text)
          if [ -z "$CNAME" ] || [ "$CNAME" = "None" ]; then
            echo "❌ Could not fetch CNAME for $EB_ENV_NAME"
            exit 1
          fi
          echo "TARGET_URL=https://$CNAME" >> $GITHUB_ENV
          echo "Environment URL: $TARGET_URL"

      - name: Wait for environment to be healthy
        run: |
          EB_ENV_NAME="${{ github.event.inputs.environment == 'staging' && env.STAGING_ENV || env.PRODUCTION_ENV }}"
          echo "Waiting for $EB_ENV_NAME to become healthy..."
          MAX_RETRIES=30
          SLEEP=10
          for i in $(seq 1 $MAX_RETRIES); do
            STATUS=$(aws elasticbeanstalk describe-environments \
              --environment-names "$EB_ENV_NAME" \
              --query 'Environments[0].Health' \
              --output text)
            echo "Attempt $i: Environment health = $STATUS"
            if [ "$STATUS" == "Green" ]; then
              echo "✅ Environment is healthy!"
              break
            fi
            sleep $SLEEP
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "❌ Environment did not become healthy after $((MAX_RETRIES*SLEEP)) seconds"
              exit 1
            fi
          done

      - name: Run smoke script
        env:
          TARGET_URL: ${{ env.TARGET_URL }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: |
          echo "Running smoke test against $TARGET_URL"
          node scripts/post_deploy_smoke.js
