name: Post-Deploy Smoke Test

# Trigger manually or after CI pipeline completes
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run smoke test against'
        required: true
        type: choice
        options:
          - staging
          - production

  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '22'
  AWS_REGION: 'us-east-1'
  EB_APP_NAME: 'manifestme-api'
  STAGING_ENV: 'manifestme-staging'
  PRODUCTION_ENV: 'manifestme-env'

jobs:
  smoke:
    name: Run Post-Deploy Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS Credentials (static)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ]; then
            echo "Configuring AWS credentials..."
            aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
            aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
            aws configure set region "${{ env.AWS_REGION }}"
          fi

      - name: Determine environment URL
        id: env-url
        run: |
          if [ "${{ github.event.inputs.environment }}" == "staging" ]; then
            EB_ENV_NAME=${{ env.STAGING_ENV }}
          else
            EB_ENV_NAME=${{ env.PRODUCTION_ENV }}
          fi
          echo "Fetching CNAME for environment: $EB_ENV_NAME"
          CNAME=$(aws elasticbeanstalk describe-environments --environment-names "$EB_ENV_NAME" --query 'Environments[0].CNAME' --output text)
          if [ -z "$CNAME" ] || [ "$CNAME" = "None" ]; then
            echo "Could not fetch CNAME for $EB_ENV_NAME"
            exit 1
          fi
          echo "TARGET_URL=https://$CNAME" >> $GITHUB_ENV

      - name: Run smoke script
        env:
          TARGET_URL: ${{ env.TARGET_URL }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: |
          echo "Running smoke test against $TARGET_URL"
          node scripts/post_deploy_smoke.js
