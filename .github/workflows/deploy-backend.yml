name: Build and Deploy Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  id-token: write # allow OIDC token issuance for aws-actions/configure-aws-credentials
  contents: read

env:
  AWS_REGION: us-east-1
  EB_ENV_NAME: manifestme-env
  EB_APP_NAME: manifestme-api
  NODE_VERSION: '22'

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean build artifacts
        # Important: remove compiled output and coverage artifacts before running tests
        # This prevents Jest from scanning compiled files under `dist/` (and `.d.ts`),
        # which previously caused tests to fail in CI. We do a best-effort cleanup.
        run: |
          rm -rf dist || true
          rm -rf coverage || true

      - name: Generate Prisma client
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
          fi

      - name: Run tests
        # Run tests before producing any build artifacts. This avoids Jest picking up
        # compiled `.d.ts` or JS files in `dist/` which can make Jest think there
        # are duplicate/empty test suites.
        run: npm run test:cjs -- --passWithNoTests

      - name: Build TypeScript
        run: npm run build || npx tsc

  deploy:
    name: Deploy to Elastic Beanstalk
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
          fi

      - name: Build application
        run: npm run build || npx tsc

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Check deploy credentials
        id: creds-check
        run: |
          # Check for OIDC role or static AWS keys; set output for conditional steps
          creds=false
          if [ -n "${{ secrets.AWS_OIDC_ROLE_ARN }}" ]; then
            creds=true
          elif [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            creds=true
          fi
          echo "credentials_present=$creds" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials (OIDC)
        if: steps.creds-check.outputs.credentials_present == 'true' && secrets.AWS_OIDC_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS Credentials (static)
        if: steps.creds-check.outputs.credentials_present == 'true' && secrets.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install EB CLI
        run: |
          python -m pip install --upgrade pip
          pip install awsebcli==3.21.14

      - name: Load secrets
        run: |
          if [ -f fetchSecret.safe.ts ]; then
            npx ts-node --files fetchSecret.safe.ts
          fi
        continue-on-error: true

      - name: Clean coverage
        run: rm -rf coverage || true

      - name: Create deployment package
        run: |
          zip -r app.zip dist/ package.json package-lock.json prisma/ .ebextensions/ -x "*.git*" "node_modules/*" "src/*" "*.ts" "tsconfig.json"

      - name: Deploy to Elastic Beanstalk
        run: |
          eb init ${{ env.EB_APP_NAME }} --region ${{ env.AWS_REGION }} --platform "Node.js 22"
          eb deploy ${{ env.EB_ENV_NAME }} --timeout 20