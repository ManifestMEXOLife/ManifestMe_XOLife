name: Build and Deploy Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  EB_ENV_NAME: manifestme-env
  EB_APP_NAME: manifestme-api
  NODE_VERSION: '22'

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
          fi

      - name: Build TypeScript
        run: npm run build || npx tsc

      - name: Clean build artifacts
        run: |
          rm -rf dist || true
          rm -rf coverage || true

      - name: Build TypeScript
        run: npm run build || npx tsc

      - name: Run tests
        # use the explicit test:cjs script to avoid duplicate --config when CI appends args
        run: npm run test:cjs -- --passWithNoTests

  deploy:
    name: Deploy to Elastic Beanstalk
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
          fi

      - name: Build application
        run: npm run build || npx tsc

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install EB CLI
        run: |
          python -m pip install --upgrade pip
          pip install awsebcli==3.21.14

      - name: Load secrets
        run: |
          if [ -f fetchSecret.safe.ts ]; then
            npx ts-node --files fetchSecret.safe.ts
          fi
        continue-on-error: true

      - name: Clean coverage
        run: rm -rf coverage || true

      - name: Create deployment package
        run: |
          zip -r app.zip dist/ package.json package-lock.json prisma/ .ebextensions/ -x "*.git*" "node_modules/*" "src/*" "*.ts" "tsconfig.json"

      - name: Deploy to Elastic Beanstalk
        run: |
          eb init ${{ env.EB_APP_NAME }} --region ${{ env.AWS_REGION }} --platform "Node.js 22"
          eb deploy ${{ env.EB_ENV_NAME }} --timeout 20