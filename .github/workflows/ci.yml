build:
  name: Build Application
  runs-on: ubuntu-latest
  needs: [lint-and-test]
  
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma client
      run: |
        if [ -f prisma/schema.prisma ]; then
          npx prisma generate --schema prisma/schema.prisma
        fi

    - name: Build application
      run: npm run build || npx tsc

    - name: Clean invalid artifact files
      run: |
        echo "Removing files with invalid characters for upload-artifact..."
        find dist -type f \( -name '*:*' -o -name '*"*' -o -name '*<*' -o -name '*>*' -o -name '*|*' -o -name '*?*' -o -name $'\r'* -o -name $'\n'* \) -exec rm -f {} \;

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-files
        path: |
          dist/
          prisma/
          package.json
          package-lock.json
        retention-days: 7
