name: Fullstack CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  AWS_REGION: 'us-east-1'
  AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
  AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
  STAGING_ENV: manifestme-staging
  PRODUCTION_ENV: manifestme-env
  EB_APP_NAME: manifestme-backend
  MAX_DEPLOY_RETRIES: 3
  DEPLOY_SLEEP: 10

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint backend and frontend
        run: npm run lint || echo "No lint script found"

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test -- --passWithNoTests --coverage

  build:
    name: Build Backend & Frontend
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --- Backend build ---
      - name: Build Backend
        run: npm run build:backend || npx tsc

      # Remove invalid artifact files
      - name: Remove invalid backend files
        run: |
          find dist -type f \( -name '*:*' -o -name '*"*"*' -o -name '*<*' -o -name '*>*' -o -name '*|*' -o -name '*?*' \) -delete

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            dist/**
            prisma/
            package.json
            package-lock.json
          retention-days: 7

      # --- Frontend build ---
      - name: Build Frontend
        run: npm run build:frontend

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: build
          retention-days: 7

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        environment: [staging, production]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download backend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: ./deploy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install EB CLI
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade awsebcli

      - name: Determine EB Environment Name
        run: |
          if [ "${{ matrix.environment }}" == "staging" ]; then
            echo "EB_ENV_NAME=${{ env.STAGING_ENV }}" >> $GITHUB_ENV
          else
            echo "EB_ENV_NAME=${{ env.PRODUCTION_ENV }}" >> $GITHUB_ENV
          fi
          echo "Deploying backend to $EB_ENV_NAME"

      - name: Create deployment package
        run: |
          cd deploy
          zip -r app.zip * -x "*.git*" "node_modules/*" "*.ts" "tsconfig.json" "**/*:*"

      - name: Deploy to Elastic Beanstalk (retry-enabled)
        run: |
          cd deploy
          for i in $(seq 1 ${{ env.MAX_DEPLOY_RETRIES }}); do
            echo "🚀 Deployment attempt $i to $EB_ENV_NAME..."
            if eb init ${{ env.EB_APP_NAME }} --region ${{ env.AWS_REGION }} --platform "Node.js 22 running on 64bit Amazon Linux 2023"; then
              eb setenv PORT=8080 || true
              if eb deploy $EB_ENV_NAME --timeout 20; then
                echo "✅ Backend deployment succeeded"
                break
              fi
            fi
            echo "⚠️ Deployment failed, retrying in ${{ env.DEPLOY_SLEEP }} seconds..."
            sleep ${{ env.DEPLOY_SLEEP }}
            if [ $i -eq ${{ env.MAX_DEPLOY_RETRIES }} ]; then
              echo "❌ Backend deployment failed after $MAX_DEPLOY_RETRIES attempts"
              exit 1
            fi
          done

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync frontend build to S3
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --acl public-read --delete
        env:
          AWS_S3_BUCKET: ${{ env.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          SOURCE_DIR: 'build'

      - name: Invalidate CloudFront (optional)
        if: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
