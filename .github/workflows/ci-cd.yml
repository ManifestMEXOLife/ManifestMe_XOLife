name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  CACHE_VERSION: v1
  FRONTEND_BUILD_DIR: build
  S3_BUCKET_STAGING: manifestme-frontend-staging
  S3_BUCKET_PROD: manifestme-frontend-prod
  BACKEND_STAGING_ENV: manifestme-staging
  BACKEND_PROD_ENV: manifestme-env
  MAX_DEPLOY_RETRIES: 3
  DEPLOY_SLEEP: 10
  AWS_REGION: us-east-1

jobs:
  # ========================
  # 1. Lint & Test Backend
  # ========================
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean build artifacts
        run: |
          rm -rf dist || true
          rm -rf coverage || true

      - name: Lint code
        run: npm run lint || echo "No lint script found"

      - name: Type check
        run: npx tsc --noEmit

      - name: Generate Prisma client
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate --schema prisma/schema.prisma
          fi

      - name: Run tests
        run: npm run test:cjs -- --passWithNoTests --coverage

      - name: Upload coverage (if token provided)
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "Uploading coverage to Codecov..."
            npx codecov -t "$CODECOV_TOKEN"
          else
            echo "⚠️ CODECOV_TOKEN not provided. Skipping coverage upload."
          fi

  # ========================
  # 2. Security Scan
  # ========================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate

      - name: Run Snyk security scan
        uses: snyk/actions/node@v1
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
        continue-on-error: true

  # ========================
  # 3. Build Application
  # ========================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate --schema prisma/schema.prisma
          fi

      - name: Build application
        run: npm run build || npx tsc

      - name: Remove invalid artifact files
        run: |
          echo "Removing files with invalid characters for artifact upload..."
          find dist -type f \( -name '*:*' -o -name '*"*"*' -o -name '*<*' -o -name '*>*' -o -name '*|*' -o -name '*?*' \) -delete

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: |
            dist/**
            prisma/
            package.json
            package-lock.json
          retention-days: 7

  # =========================
  # 4. Deploy Frontend to S3
  # =========================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        environment: [staging, production]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build artifact
        uses: actions/download-artifact@v3
        with:
          name: build-files
          path: ${{ env.FRONTEND_BUILD_DIR }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set S3 bucket
        run: |
          if [ "${{ matrix.environment }}" == "staging" ]; then
            echo "S3_BUCKET=${{ env.S3_BUCKET_STAGING }}" >> $GITHUB_ENV
          else
            echo "S3_BUCKET=${{ env.S3_BUCKET_PROD }}" >> $GITHUB_ENV
          fi
          echo "Deploying frontend to $S3_BUCKET"

      - name: Sync files to S3
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --acl public-read --delete --exact-timestamps
          source-dir: ${{ env.FRONTEND_BUILD_DIR }}
          dest-dir: /
        env:
          AWS_S3_BUCKET: ${{ env.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}

  # =========================
  # 5. Deploy Backend to EB
  # =========================
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        environment: [staging, production]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend build artifact
        uses: actions/download-artifact@v3
        with:
          name: build-files
          path: ./deploy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install EB CLI
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade awsebcli

      - name: Determine EB environment
        run: |
          if [ "${{ matrix.environment }}" == "staging" ]; then
            echo "EB_ENV_NAME=${{ env.BACKEND_STAGING_ENV }}" >> $GITHUB_ENV
          else
            echo "EB_ENV_NAME=${{ env.BACKEND_PROD_ENV }}" >> $GITHUB_ENV
          fi
          echo "Deploying backend to $EB_ENV_NAME"

      - name: Verify EB environment exists
        run: |
          if ! eb status $EB_ENV_NAME > /dev/null 2>&1; then
            echo "❌ Elastic Beanstalk environment $EB_ENV_NAME does not exist!"
            exit 1
          fi

      - name: Create deployment package
        run: |
          cd deploy
          zip -r app.zip * -x "*.git*" "node_modules/*" "*.ts" "tsconfig.json" "**/*:*"

      - name: Deploy to Elastic Beanstalk (retry-enabled)
        run: |
          cd deploy
          for i in $(seq 1 ${{ env.MAX_DEPLOY_RETRIES }}); do
            echo "🚀 Deployment attempt $i to $EB_ENV_NAME..."
            if eb init ${{ env.EB_APP_NAME }} --region ${{ env.AWS_REGION }} --platform "Node.js 22 running on 64bit Amazon Linux 2023"; then
              eb setenv PORT=8080 || true
              if eb deploy $EB_ENV_NAME --timeout 20; then
                echo "✅ Deployment succeeded"
                break
              fi
            fi
            echo "⚠️ Deployment failed, retrying in ${{ env.DEPLOY_SLEEP }} seconds..."
            sleep ${{ env.DEPLOY_SLEEP }}
            if [ $i -eq ${{ env.MAX_DEPLOY_RETRIES }} ]; then
              echo "❌ Deployment failed after $MAX_DEPLOY_RETRIES attempts"
              exit 1
            fi
          done
