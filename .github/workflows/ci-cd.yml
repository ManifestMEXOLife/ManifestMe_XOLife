name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  CACHE_VERSION: v1
  FRONTEND_BUILD_DIR: build
  S3_BUCKET_STAGING: manifestme-frontend-staging
  S3_BUCKET_PROD: manifestme-frontend-prod
  BACKEND_STAGING_ENV: manifestme-staging
  BACKEND_PROD_ENV: manifestme-env
  MAX_DEPLOY_RETRIES: 3
  DEPLOY_SLEEP: 10
  AWS_REGION: us-east-1

jobs:
  # ========================
  # 1. Lint & Test Backend
  # ========================
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Clean build artifacts
        run: |
          rm -rf dist || true
          rm -rf coverage || true
          
      - name: Lint code
        run: npm run lint || echo "No lint script found"
        
      - name: Type check
        run: npx tsc --noEmit
        
      - name: Generate Prisma client
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate --schema prisma/schema.prisma
          fi
          
      - name: Run tests
        run: npm run test:cjs -- --passWithNoTests --coverage
        
      - name: Upload coverage (if token provided)
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "Uploading coverage to Codecov..."
            npx codecov -t "$CODECOV_TOKEN"
          else
            echo "⚠️ CODECOV_TOKEN not provided. Skipping coverage upload."
          fi

  # ========================
  # 2. Security Scan
  # ========================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: npm ci
        
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        
      - name: Run Snyk security scan
        uses: snyk/actions/node@v1
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
        continue-on-error: true

  # ========================
  # 3. Build Application
  # ========================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Generate Prisma client
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate --schema prisma/schema.prisma
          fi
          
      - name: Build application
        run: npm run build
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-files
          path: |
            dist/**
            build/**
            package.json
            package-lock.json
          retention-days: 7

  # ========================
  # 4. Deploy Backend (Staging)
  # ========================
  deploy-backend-staging:
    name: Deploy Backend (Staging)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: ./deploy
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Deploy to Elastic Beanstalk (Staging)
        run: |
          cd deploy
          for i in $(seq 1 ${{ env.MAX_DEPLOY_RETRIES }}); do
            echo "🚀 Deployment attempt $i to staging..."
            set +e
            eb init manifestme-backend --region ${{ env.AWS_REGION }} --platform "Node.js 22"
            eb setenv PORT=8080 || true
            eb deploy ${{ env.BACKEND_STAGING_ENV }} --timeout 20
            status=$?
            set -e
            if [ $status -eq 0 ]; then
              echo "✅ Staging deployment succeeded"
              break
            fi
            echo "⚠️ Deployment failed, retrying in ${{ env.DEPLOY_SLEEP }} seconds..."
            sleep ${{ env.DEPLOY_SLEEP }}
            if [ $i -eq ${{ env.MAX_DEPLOY_RETRIES }} ]; then
              echo "❌ Deployment failed after ${{ env.MAX_DEPLOY_RETRIES }} attempts"
              exit 1
            fi
          done

  # ========================
  # 5. Deploy Frontend (Staging)
  # ========================
  deploy-frontend-staging:
    name: Deploy Frontend (Staging)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: ./deploy
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Deploy to S3 (Staging)
        run: |
          aws s3 sync deploy/build/ s3://${{ env.S3_BUCKET_STAGING }} \
            --region ${{ env.AWS_REGION }} \
            --delete

  # ========================
  # 6. Deploy Backend (Production)
  # ========================
  deploy-backend-production:
    name: Deploy Backend (Production)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: ./deploy
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Deploy to Elastic Beanstalk (Production)
        run: |
          cd deploy
          for i in $(seq 1 ${{ env.MAX_DEPLOY_RETRIES }}); do
            echo "🚀 Deployment attempt $i to production..."
            set +e
            eb init manifestme-backend --region ${{ env.AWS_REGION }} --platform "Node.js 22"
            eb setenv PORT=8080 || true
            eb deploy ${{ env.BACKEND_PROD_ENV }} --timeout 20
            status=$?
            set -e
            if [ $status -eq 0 ]; then
              echo "✅ Production deployment succeeded"
              break
            fi
            echo "⚠️ Deployment failed, retrying in ${{ env.DEPLOY_SLEEP }} seconds..."
            sleep ${{ env.DEPLOY_SLEEP }}
            if [ $i -eq ${{ env.MAX_DEPLOY_RETRIES }} ]; then
              echo "❌ Deployment failed after ${{ env.MAX_DEPLOY_RETRIES }} attempts"
              exit 1
            fi
          done

  # ========================
  # 7. Deploy Frontend (Production)
  # ========================
  deploy-frontend-production:
    name: Deploy Frontend (Production)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: ./deploy
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Deploy to S3 (Production)
        run: |
          aws s3 sync deploy/build/ s3://${{ env.S3_BUCKET_PROD }} \
            --region ${{ env.AWS_REGION }} \
            --delete
