name: Verify Secrets

on:
  workflow_dispatch: {}

jobs:
  verify:
    name: Verify required repository secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check required secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_OIDC_ROLE_ARN_STAGING: ${{ secrets.AWS_OIDC_ROLE_ARN_STAGING }}
          EB_APP_NAME_STAGING: ${{ secrets.EB_APP_NAME_STAGING }}
          EB_ENV_NAME_STAGING: ${{ secrets.EB_ENV_NAME_STAGING }}
        run: |
          echo "🔍 Verifying required repository secrets..."
          missing=false
          declare -A secrets_map=(
            ["AWS_ACCESS_KEY_ID"]="$AWS_ACCESS_KEY_ID"
            ["AWS_SECRET_ACCESS_KEY"]="$AWS_SECRET_ACCESS_KEY"
            ["AWS_REGION"]="$AWS_REGION"
            ["AWS_OIDC_ROLE_ARN_STAGING"]="$AWS_OIDC_ROLE_ARN_STAGING"
            ["EB_APP_NAME_STAGING"]="$EB_APP_NAME_STAGING"
            ["EB_ENV_NAME_STAGING"]="$EB_ENV_NAME_STAGING"
          )

          for key in "${!secrets_map[@]}"; do
            if [ -z "${secrets_map[$key]}" ]; then
              echo "❌ Missing secret: $key"
              missing=true
            else
              echo "✅ Found secret: $key"
            fi
          done

          if [ "$missing" = true ]; then
            echo "🚨 One or more required secrets are missing!"
            exit 1
          else
            echo "✅ All required secrets are present."
          fi

      - name: Confirm mask behavior
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "🔒 Secrets are masked by GitHub:"
          echo "AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID"
          echo "AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY"
