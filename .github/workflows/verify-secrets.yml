name: Verify Secrets

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: Verify required repository secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check required secrets
        run: |
          echo "🔍 Verifying required repository secrets..."
          missing=false
          # List of required secrets
          required_secrets=("AWS_ACCESS_KEY_ID" "AWS_SECRET_ACCESS_KEY" "AWS_REGION" "AWS_OIDC_ROLE_ARN_STAGING" "EB_APP_NAME_STAGING" "EB_ENV_NAME_STAGING")

          for secret_name in "${required_secrets[@]}"; do
            # Access the secret via env
            value="${!secret_name}"
            if [ -z "$value" ]; then
              echo "❌ Missing secret: $secret_name"
              missing=true
            else
              echo "✅ Found secret: $secret_name"
            fi
          done

          if [ "$missing" = true ]; then
            echo "🚨 One or more required secrets are missing!"
            exit 1
          else
            echo "✅ All required secrets are present."
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_OIDC_ROLE_ARN_STAGING: ${{ secrets.AWS_OIDC_ROLE_ARN_STAGING }}
          EB_APP_NAME_STAGING: ${{ secrets.EB_APP_NAME_STAGING }}
          EB_ENV_NAME_STAGING: ${{ secrets.EB_ENV_NAME_STAGING }}

      - name: Confirm mask behavior
        run: |
          echo "🔒 Secrets are masked by GitHub:"
          echo "AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID"
          echo "AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
