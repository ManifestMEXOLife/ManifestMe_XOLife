name: Verify Secrets

on:
  workflow_dispatch: {}

jobs:
  verify:
    name: Verify required repository secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check required secrets
        run: |
          echo "🔍 Verifying required repository secrets..."
          missing=false

          # Check each secret individually
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "❌ Missing secret: AWS_ACCESS_KEY_ID"
            missing=true
          else
            echo "✅ Found secret: AWS_ACCESS_KEY_ID"
          fi

          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "❌ Missing secret: AWS_SECRET_ACCESS_KEY"
            missing=true
          else
            echo "✅ Found secret: AWS_SECRET_ACCESS_KEY"
          fi

          if [ -z "${{ secrets.AWS_REGION }}" ]; then
            echo "❌ Missing secret: AWS_REGION"
            missing=true
          else
            echo "✅ Found secret: AWS_REGION"
          fi

          if [ -z "${{ secrets.AWS_OIDC_ROLE_ARN_STAGING }}" ]; then
            echo "❌ Missing secret: AWS_OIDC_ROLE_ARN_STAGING"
            missing=true
          else
            echo "✅ Found secret: AWS_OIDC_ROLE_ARN_STAGING"
          fi

          if [ -z "${{ secrets.EB_APP_NAME_STAGING }}" ]; then
            echo "❌ Missing secret: EB_APP_NAME_STAGING"
            missing=true
          else
            echo "✅ Found secret: EB_APP_NAME_STAGING"
          fi

          if [ -z "${{ secrets.EB_ENV_NAME_STAGING }}" ]; then
            echo "❌ Missing secret: EB_ENV_NAME_STAGING"
            missing=true
          else
            echo "✅ Found secret: EB_ENV_NAME_STAGING"
          fi

          if [ "$missing" = true ]; then
            echo "🚨 One or more required secrets are missing!"
            exit 1
          else
            echo "✅ All required secrets are present."
          fi

      - name: Confirm mask behavior
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "🔒 Secrets are masked by GitHub:"
          echo "AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID"
          echo "AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY"
