name: Verify Secrets

on:
  workflow_dispatch: {}

jobs:
  verify:
    name: Verify required repository secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Show masked secret presence
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EB_APP_NAME: ${{ secrets.EB_APP_NAME }}
          EB_ENV_NAME: ${{ secrets.EB_ENV_NAME }}
        run: |
          echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:+present}"
          echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:+present}"
          echo "AWS_REGION=${AWS_REGION:-not set}"
          echo "EB_APP_NAME=${EB_APP_NAME:-not set}"
          echo "EB_ENV_NAME=${EB_ENV_NAME:-not set}"

      - name: Run fetchSecret.safe.ts (attempt)
        if: ${{ secrets.AWS_ACCESS_KEY_ID && secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "Running fetchSecret.safe.ts to attempt retrieving secrets (this is safe)"
          npx ts-node --files fetchSecret.safe.ts || echo "fetchSecret.safe.ts exited with non-zero status but did not halt workflow"
