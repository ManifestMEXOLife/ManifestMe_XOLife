name: Database Migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run migration'
        required: true
        type: choice
        options:
          - staging
          - production
      migration_type:
        description: 'Migration type'
        required: true
        type: choice
        options:
          - deploy
          - reset
          - seed
      confirm:
        description: 'Type "CONFIRM" to proceed'
        required: true
        type: string

env:
  NODE_VERSION: '22'

jobs:
  validate-input:
    name: Validate Input
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        if: ${{ inputs.confirm != 'CONFIRM' }}
        run: |
          echo "❌ Migration cancelled - confirmation required"
          exit 1

  migrate:
    name: Run Migration on ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: [validate-input]
    environment: ${{ inputs.environment }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean build artifacts
        run: |
          rm -rf dist || true
          rm -rf coverage || true

      - name: Check migration credentials
        id: creds-check
        run: |
          creds=false
          if [ "${{ inputs.environment }}" = "production" ]; then
            if [ -n "${{ secrets.AWS_OIDC_ROLE_ARN }}" ] || [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
              creds=true
            fi
          else
            if [ -n "${{ secrets.AWS_OIDC_ROLE_ARN_STAGING }}" ] || [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
              creds=true
            fi
          fi
          echo "credentials_present=$creds" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials (conditional)
        if: steps.creds-check.outputs.credentials_present == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.environment == 'production' && secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_OIDC_ROLE_ARN_STAGING }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Load database secrets
        run: |
          if [ -f fetchSecret.safe.ts ]; then
            npx ts-node --files fetchSecret.safe.ts
          fi

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migration deploy
        if: ${{ inputs.migration_type == 'deploy' }}
        run: npx prisma migrate deploy

      - name: Reset database
        if: ${{ inputs.migration_type == 'reset' }}
        run: npx prisma migrate reset --force

      - name: Seed database
        if: ${{ inputs.migration_type == 'seed' }}
        run: npx prisma db seed

      - name: Verify migration
        run: npx prisma migrate status