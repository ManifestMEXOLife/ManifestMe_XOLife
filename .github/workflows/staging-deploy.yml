name: Staging Deploy

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main ]
    types: [ labeled ]
  workflow_dispatch: {}

concurrency:
  group: staging-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

permissions:
  id-token: write
  contents: read

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.label.name, 'deploy-staging') }}
    environment: staging
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean build artifacts
        run: |
          rm -rf dist coverage || true

      - name: Generate Prisma client
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
          fi

      - name: Run tests
        run: npm run test:cjs -- --passWithNoTests

      - name: Build application
        run: npm run build || npx tsc

      - name: Configure AWS Credentials (OIDC or static)
        id: aws-creds
        run: |
          echo "🔍 Checking AWS credentials..."
          if [ -n "${{ secrets.AWS_OIDC_ROLE_ARN_STAGING }}" ]; then
            echo "✅ Using OIDC role credentials"
            echo "method=oidc" >> $GITHUB_OUTPUT
          elif [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "✅ Using static access key credentials"
            echo "method=static" >> $GITHUB_OUTPUT
          else
            echo "❌ No AWS credentials found — stopping deployment"
            exit 1
          fi

      - name: Configure AWS OIDC Credentials
        if: steps.aws-creds.outputs.method == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS Static Credentials
        if: steps.aws-creds.outputs.method == 'static'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python for EB CLI
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install EB CLI
        run: pip install awsebcli==3.21.14

      - name: Deploy to staging
        run: |
          eb init ${{ secrets.EB_APP_NAME_STAGING || 'manifestme-api-staging' }} --region ${{ env.AWS_REGION }} --platform "Node.js 22"
          sleep 5
          eb deploy ${{ secrets.EB_ENV_NAME_STAGING || 'manifestme-staging' }} --timeout 15

      - name: Comment PR with staging URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Deployed to staging! Check it out at: https://manifestme-staging.elasticbeanstalk.com'
            })
