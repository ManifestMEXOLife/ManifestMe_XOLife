name: Deploy to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout your repo
      - name: Checkout code
        uses: actions/checkout@v4          # automatically picks latest minor/patch in v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4       # automatically updates within v4

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build project
      - name: Build project
        run: npm run build

      # 5. Sync with S3
      - name: Sync to S3
        uses: aws-actions/aws-s3-sync@v1   # auto-updates within v1
        with:
          source: "dist/"                  # your build/output folder
          bucket: ${{ secrets.AWS_S3_BUCKET }}
          region: "us-east-1"              # change as needed
          delete: true
          acl: "public-read"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # 6. Invalidate CloudFront cache
      - name: Invalidate CloudFront
        uses: chetan/invalidate-cloudfront-action@v1  # auto-updates within v1
        with:
          distribution-id: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          paths: "/*"
          aws-region: "us-east-1"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
