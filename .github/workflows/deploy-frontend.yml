name: Deploy to S3

# Trigger workflow on push to main branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4   # Always uses the latest v4 stable release

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4  # Latest stable Node setup
        with:
          node-version: '18'        # Change to your desired Node version
          cache: 'npm'

      # Step 3: Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2  # Latest v2 stable
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 4: Install dependencies and build
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      # Step 5: Sync build files to S3
      # Step 5: Sync build files to S3
      - name: Sync files to S3
        uses: aws-actions/aws-s3-sync@v1   # Correct repository
        with:
          source: "build/"
          bucket: ${{ secrets.S3_BUCKET }}
          region: ${{ secrets.AWS_REGION }}
          delete: true

      # Step 6 (Optional): Invalidate CloudFront cache
      - name: Invalidate CloudFront
        uses: chetan/invalidate-cloudfront-action@v1  # Latest v1 stable
        with:
          distribution: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          paths: "/*"
