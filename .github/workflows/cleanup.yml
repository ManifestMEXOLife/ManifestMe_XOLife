name: Cleanup Old Artifacts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * SUN'  # Every Sunday at midnight UTC

permissions:
  contents: read
  actions: write  # Needed to delete artifacts

jobs:
  cleanup:
    name: Delete old artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Delete artifacts older than 30 days
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const perPage = 100;
              let page = 1;
              const cutoff = new Date();
              cutoff.setDate(cutoff.getDate() - 30);

              while (true) {
                const artifacts = await github.rest.actions.listArtifactsForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  per_page: perPage,
                  page
                });

                if (artifacts.data.artifacts.length === 0) break;

                for (const artifact of artifacts.data.artifacts) {
                  try {
                    if (new Date(artifact.created_at) < cutoff) {
                      await github.rest.actions.deleteArtifact({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        artifact_id: artifact.id
                      });
                      console.log(`Deleted artifact: ${artifact.name}`);
                    }
                  } catch (innerError) {
                    console.error(`Failed to delete artifact ${artifact.name}:`, innerError);
                  }
                }
                page++;
              }
            } catch (error) {
              console.error('Cleanup job failed:', error);
              // Optionally fail the job
              throw error;
            }
