name: Build & Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '22'
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

permissions:
  id-token: write
  contents: read

jobs:
  pre-deploy-checks:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: rm -rf dist coverage || true
      - run: npx prisma generate || true
      - run: npm run test:cjs -- --passWithNoTests
      - run: npm audit --audit-level=high

  build-and-deploy:
    name: Build & Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: pre-deploy-checks
    if: always() && (needs.pre-deploy-checks.result == 'success' || inputs.skip_tests)
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build || npx tsc

      # Configure AWS credentials
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - run: |
          zip -r app-${{ github.sha }}.zip . -x "*.git*" "node_modules/*" "*.log" "*.ts" "tsconfig.json"

      - name: Deploy to Elastic Beanstalk
        run: |
          eb init ${{ secrets.EB_APP_NAME || 'manifestme-api' }} \
            --region ${{ env.AWS_REGION }} \
            --platform "Node.js 22 running on 64bit Amazon Linux 2023"
          eb deploy ${{ secrets.EB_ENV_NAME || 'manifestme-env' }} --staged --timeout 20
          echo "Deployed to $(eb status | grep CNAME | awk '{print $2}')"

      - run: sleep 30 && curl -f $(eb status | grep CNAME | awk '{print $2}')/health || exit 1

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: always()
    steps:
      - run: echo "✅ Deployment successful" if needs.build-and-deploy.result == 'success'
      - run: echo "❌ Deployment failed" && exit 1 if needs.build-and-deploy.result == 'failure'
