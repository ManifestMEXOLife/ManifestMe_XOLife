name: Build & Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '22'
  AWS_REGION: 'us-east-1'

permissions:
  id-token: write
  contents: read

jobs:
  pre-deploy-checks:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean build artifacts
        run: |
          rm -rf dist coverage || true

      - name: Generate Prisma client
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
          fi

      - name: Run tests
        run: npm run test:cjs -- --passWithNoTests

      - name: Security audit
        run: npm audit --audit-level=high

  build-and-deploy:
    name: Build & Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: pre-deploy-checks
    if: always() && (needs.pre-deploy-checks.result == 'success' || inputs.skip_tests)
    environment: ${{ inputs.environment }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build || npx tsc

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_OIDC_ROLE_ARN_STAGING }}
          audience: sts.amazonaws.com
          output-env-credentials: true

      - name: Setup Python for EB CLI
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install EB CLI
        run: pip install --upgrade awsebcli

      - name: Create deployment package
        run: |
          if [ -d dist ]; then
            zip -r app-${{ github.sha }}.zip dist package.json package-lock.json prisma/ -x "*.git*" "node_modules/*" "*.log"
          else
            zip -r app-${{ github.sha }}.zip . -x "*.git*" "node_modules/*" "*.log" "dist/*" "src/*" "*.ts" "tsconfig.json" ".ebextensions/*"
          fi

      - name: Deploy to Elastic Beanstalk
        id: deploy
        run: |
          eb init ${{ secrets.EB_APP_NAME || 'manifestme-api' }} \
            --region ${{ env.AWS_REGION }} \
            --platform "Node.js 22 running on 64bit Amazon Linux 2023"
          eb deploy ${{ secrets.EB_ENV_NAME || 'manifestme-env' }} --staged --timeout 20
          echo "environment-url=$(eb status | grep CNAME | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Run health check
        run: |
          ENV_URL=${{ steps.deploy.outputs.environment-url }}
          echo "Checking health at $ENV_URL/health..."
          RETRIES=12
          SLEEP=10
          SUCCESS=0
          for i in $(seq 1 $RETRIES); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $ENV_URL/health || true)
            echo "Attempt $i: HTTP status $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              SUCCESS=1
              break
            fi
            sleep $SLEEP
          done
          if [ "$SUCCESS" -ne 1 ]; then
            echo "❌ Health check failed after $((RETRIES*SLEEP)) seconds"
            exit 1
          fi
          echo "✅ Health check passed!"

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: always()
    
    steps:
      - name: Notify success
        if: needs.build-and-deploy.result == 'success'
        run: echo "✅ Deployment successful to ${{ needs.build-and-deploy.outputs.deployment-url }}"
          
      - name: Notify failure
        if: needs.build-and-deploy.result == 'failure'
        run: |
          echo "❌ Deployment failed"
          exit 1
