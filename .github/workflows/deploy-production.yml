name: Deploy Production Backend

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests before deploy'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '22'
  AWS_REGION: 'us-east-1'
  EB_APP_NAME: 'manifestme-api'
  EB_ENV_NAME: 'manifestme-env'
  MAX_HEALTH_RETRIES: 60
  HEALTH_SLEEP: 15
  MAX_SMOKE_RETRIES: 5
  SMOKE_SLEEP: 10

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean build artifacts
        run: |
          rm -rf dist coverage || true

      - name: Generate Prisma client
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
          fi

      - name: Run tests
        run: npm run test:cjs -- --passWithNoTests

      - name: Build TypeScript
        run: npm run build || npx tsc

  deploy:
    name: Deploy to Elastic Beanstalk
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
          fi

      - name: Build application
        run: npm run build || npx tsc

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install EB CLI
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade awsebcli

      - name: Wait for EB environment to be Ready
        run: |
          echo "⏳ Waiting for EB environment ${{ env.EB_ENV_NAME }} to be Ready..."
          SUCCESS=0
          for i in $(seq 1 ${{ env.MAX_HEALTH_RETRIES }}); do
            STATUS=$(eb status ${{ env.EB_ENV_NAME }} | grep "Status:" | awk '{print $2}')
            echo "Attempt $i: Status=$STATUS"
            if [ "$STATUS" = "Ready" ]; then
              SUCCESS=1
              break
            fi
            sleep ${{ env.HEALTH_SLEEP }}
          done
          if [ "$SUCCESS" -ne 1 ]; then
            echo "❌ EB environment not Ready after $(( ${{ env.MAX_HEALTH_RETRIES }} * ${{ env.HEALTH_SLEEP }} )) seconds"
            exit 1
          fi
          echo "✅ EB environment is Ready!"

      - name: Create deployment package
        run: |
          zip -r app-${{ github.sha }}.zip dist package.json package-lock.json prisma/ Procfile -x "*.git*" "node_modules/*"

      - name: Deploy to Elastic Beanstalk (with retries)
        run: |
          RETRIES=3
          for i in $(seq 1 $RETRIES); do
            echo "🚀 Attempt $i to deploy"
            if eb deploy ${{ env.EB_ENV_NAME }} --staged --timeout 20; then
              echo "✅ Deployment succeeded on attempt $i"
              break
            else
              echo "⚠️ Deployment attempt $i failed. Retrying in 15s..."
              sleep 15
            fi
          done

      - name: Wait for EB environment health to be Green
        run: |
          echo "⏳ Checking EB environment health..."
          SUCCESS=0
          for i in $(seq 1 ${{ env.MAX_HEALTH_RETRIES }}); do
            HEALTH=$(eb status ${{ env.EB_ENV_NAME }} | grep "Health:" | awk '{print $2}')
            echo "Attempt $i: Health=$HEALTH"
            if [ "$HEALTH" = "Green" ]; then
              SUCCESS=1
              break
            fi
            sleep ${{ env.HEALTH_SLEEP }}
          done
          if [ "$SUCCESS" -ne 1 ]; then
            echo "❌ EB environment health did not become Green"
            exit 1
          fi
          echo "✅ EB environment health is Green!"

      - name: Run Smoke Test
        uses: actions/github-script@v6
        with:
          script: |
            const { execSync } = require('child_process');
            const TARGET_URL = execSync(`eb status ${{ env.EB_ENV_NAME }} | grep CNAME | awk '{print $2}'`).toString().trim();
            process.env.TARGET_URL = `https://${TARGET_URL}`;
            console.log("Running smoke test against:", process.env.TARGET_URL);
            let success = false;
            for (let i = 1; i <= ${{ env.MAX_SMOKE_RETRIES }}; i++) {
              try {
                execSync('node scripts/post_deploy_smoke.js', { stdio: 'inherit', env: process.env });
                console.log(`✅ Smoke test passed on attempt ${i}`);
                success = true;
                break;
              } catch (err) {
                console.warn(`⚠️ Smoke test failed on attempt ${i}, retrying in ${{ env.SMOKE_SLEEP }}s`);
                execSync(`sleep ${{ env.SMOKE_SLEEP }}`);
              }
            }
            if (!success) {
              throw new Error(`❌ Smoke test failed after ${{ env.MAX_SMOKE_RETRIES }} attempts`);
            }
