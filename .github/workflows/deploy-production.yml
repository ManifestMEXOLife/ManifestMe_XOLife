name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      skip_smoke_tests:
        description: 'Skip smoke tests'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: 'us-east-1'
  EB_APP_NAME: 'manifestme-api'
  EB_ENV_NAME: 'manifestme-env'

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      # ---------------------------
      # 1️⃣ Download CI Build Artifact
      # ---------------------------
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: ./artifact

      # ---------------------------
      # 2️⃣ Configure AWS Credentials
      # ---------------------------
      - name: Check deploy credentials
        id: creds-check
        run: |
          creds=false
          if [ -n "${{ secrets.AWS_OIDC_ROLE_ARN }}" ]; then
            creds=true
            echo "USE_OIDC=true" >> $GITHUB_ENV
          elif [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            creds=true
            echo "USE_STATIC=true" >> $GITHUB_ENV
          fi
          echo "credentials_present=$creds" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials (OIDC)
        if: steps.creds-check.outputs.credentials_present == 'true' && env.USE_OIDC == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS Credentials (Static)
        if: steps.creds-check.outputs.credentials_present == 'true' && env.USE_STATIC == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ---------------------------
      # 3️⃣ Install EB CLI
      # ---------------------------
      - name: Setup Python & EB CLI
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install awsebcli

      # ---------------------------
      # 4️⃣ Prepare Deployment Package
      # ---------------------------
      - name: Create deployment package
        run: |
          cd artifact
          zip -r app-${{ github.sha }}.zip dist package.json package-lock.json prisma/ Procfile -x "*.git*" "node_modules/*"

      # ---------------------------
      # 5️⃣ Deploy to Elastic Beanstalk (Retry-Friendly)
      # ---------------------------
      - name: Deploy to Elastic Beanstalk
        run: |
          cd artifact
          eb init ${{ env.EB_APP_NAME }} --region ${{ env.AWS_REGION }} --platform "Node.js 22 running on 64bit Amazon Linux 2023"
          eb setenv PORT=8080 || true

          RETRIES=3
          for i in $(seq 1 $RETRIES); do
            echo "🚀 Deployment attempt $i"
            if eb deploy ${{ env.EB_ENV_NAME }} --staged --timeout 20; then
              echo "✅ Deployment succeeded on attempt $i"
              break
            else
              echo "⚠️ Deployment attempt $i failed, retrying in 15s..."
              sleep 15
            fi
          done

      # ---------------------------
      # 6️⃣ Wait for EB Environment Health
      # ---------------------------
      - name: Wait for EB environment health
        run: |
          echo "⏳ Checking environment health for ${{ env.EB_ENV_NAME }}..."
          MAX_RETRIES=40
          SLEEP=15
          SUCCESS=0
          for i in $(seq 1 $MAX_RETRIES); do
            HEALTH=$(eb status ${{ env.EB_ENV_NAME }} | grep "Health:" | awk '{print $2}')
            echo "Attempt $i: Health=$HEALTH"
            if [ "$HEALTH" == "Green" ]; then
              SUCCESS=1
              break
            fi
            sleep $SLEEP
          done
          if [ "$SUCCESS" -ne 1 ]; then
            echo "❌ Environment health did not become Green"
            exit 1
          fi
          echo "✅ Environment is Green!"

      # ---------------------------
      # 7️⃣ Output EB Environment URL
      # ---------------------------
      - name: Output EB environment URL
        id: env-url
        run: |
          URL=$(eb status ${{ env.EB_ENV_NAME }} | grep CNAME | awk '{print $2}')
          echo "environment-url=https://$URL" >> $GITHUB_OUTPUT

      # ---------------------------
      # 8️⃣ Optional Smoke Test
      # ---------------------------
      - name: Run Post-Deploy Smoke Test
        if: ${{ github.event.inputs.skip_smoke_tests != 'true' }}
        env:
          TARGET_URL: ${{ steps.env-url.outputs.environment-url }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: |
          echo "Running smoke test against $TARGET_URL"
          node scripts/post_deploy_smoke.js
