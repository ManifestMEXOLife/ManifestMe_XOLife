name: Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}-${{ inputs.environment }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  AWS_REGION: ${{ secrets.AWS_REGION }}

permissions:
  id-token: write
  contents: read

jobs:
  pre-deploy-checks:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean build artifacts
        run: |
          rm -rf dist || true
          rm -rf coverage || true

      - name: Generate Prisma client
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
          fi

      - name: Run tests
        run: npm run test:cjs -- --passWithNoTests

      - name: Security audit
        run: npm audit --audit-level=high

  build-and-deploy:
    name: Build & Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks]
    if: always() && (needs.pre-deploy-checks.result == 'success' || inputs.skip_tests)
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build || npx tsc

      - name: Setup Python for EB CLI
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          check-repo: false

      - name: Install EB CLI
        run: pip install awsebcli

      - name: Configure AWS Credentials
        id: aws-creds
        run: |
          echo "credentials_present=false" >> $GITHUB_OUTPUT
          ENV="${{ inputs.environment }}"
          ROLE=""
          ACCESS=""
          if [ "$ENV" = "production" ]; then
            if [ -n "${{ secrets.AWS_OIDC_ROLE_ARN }}" ]; then
              echo "credentials_present=true" >> $GITHUB_OUTPUT
              echo "role=${{ secrets.AWS_OIDC_ROLE_ARN }}" >> $GITHUB_OUTPUT
            elif [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
              echo "credentials_present=true" >> $GITHUB_OUTPUT
              echo "access=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_OUTPUT
            fi
          else
            if [ -n "${{ secrets.AWS_OIDC_ROLE_ARN_STAGING }}" ]; then
              echo "credentials_present=true" >> $GITHUB_OUTPUT
              echo "role=${{ secrets.AWS_OIDC_ROLE_ARN_STAGING }}" >> $GITHUB_OUTPUT
            elif [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
              echo "credentials_present=true" >> $GITHUB_OUTPUT
              echo "access=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Deploy to Elastic Beanstalk
        if: steps.aws-creds.outputs.credentials_present == 'true'
        run: |
          eb init ${{ secrets.EB_APP_NAME || 'manifestme-api' }} --region ${{ env.AWS_REGION }} --platform "Node.js 22 running on 64bit Amazon Linux 2023"
          eb deploy ${{ secrets.EB_ENV_NAME || 'manifestme-env' }} --staged --timeout 20
          echo "environment-url=$(eb status | grep CNAME | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Run health check
        run: |
          sleep 30
          curl -f ${{ steps.deploy.outputs.environment-url }}/health || exit 1

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [build-and-deploy]
    if: always()
    steps:
      - name: Notify success
        if: needs.build-and-deploy.result == 'success'
        run: |
          echo "✅ Deployment successful to ${{ needs.build-and-deploy.outputs.deployment-url }}"

      - name: Notify failure
        if: needs.build-and-deploy.result == 'failure'
        run: |
          echo "❌ Deployment failed"
          exit 1
