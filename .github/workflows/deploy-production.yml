name: Production Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '22'
  AWS_REGION: ${{ secrets.AWS_REGION }}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build || npx tsc

      - name: Setup Python for EB CLI
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install EB CLI
        run: pip install --upgrade awsebcli

      - name: Initialize EB environment
        run: |
          eb init ${{ secrets.EB_APP_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --platform "Node.js 22 running on 64bit Amazon Linux 2023"

      - name: Deploy to Elastic Beanstalk
        run: |
          eb deploy ${{ secrets.EB_ENV_NAME }} --staged --timeout 20

      - name: Health check
        run: |
          sleep 30
          curl -f $(eb status ${{ secrets.EB_ENV_NAME }} | grep CNAME | awk '{print $2}')/health || exit 1
