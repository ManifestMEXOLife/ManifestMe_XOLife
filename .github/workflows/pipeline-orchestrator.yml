name: Pipeline Orchestrator

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip CI tests'
        required: false
        default: false
        type: boolean
      skip_deploy:
        description: 'Skip deployment'
        required: false
        default: false
        type: boolean
      environment:
        description: 'Deploy environment'
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '22'
  AWS_REGION: 'us-east-1'
  EB_APP_NAME: 'manifestme-api'
  STAGING_ENV: 'manifestme-staging'
  PRODUCTION_ENV: 'manifestme-env'
  MAX_HEALTH_RETRIES: 60
  HEALTH_SLEEP: 15
  MAX_SMOKE_RETRIES: 5
  SMOKE_SLEEP: 10

jobs:
  ci:
    name: CI - Lint, Test & Build
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean build artifacts
        run: rm -rf dist coverage || true

      - name: Lint
        run: npm run lint || echo "No lint script found"

      - name: Type check
        run: npx tsc --noEmit

      - name: Generate Prisma client
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
          fi

      - name: Run tests
        run: npm run test:cjs -- --passWithNoTests

      - name: Build app
        run: npm run build || npx tsc

  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: ci
    if: ${{ !inputs.skip_deploy }}
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
          fi

      - name: Build app
        run: npm run build || npx tsc

      - name: Setup Python & EB CLI
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade awsebcli

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set EB environment
        run: |
          if [ "${{ inputs.environment }}" == "staging" ]; then
            echo "EB_ENV=${{ env.STAGING_ENV }}" >> $GITHUB_ENV
          else
            echo "EB_ENV=${{ env.PRODUCTION_ENV }}" >> $GITHUB_ENV
          fi

      - name: Wait for EB environment Ready
        run: |
          SUCCESS=0
          for i in $(seq 1 ${{ env.MAX_HEALTH_RETRIES }}); do
            STATUS=$(eb status $EB_ENV | grep "Status:" | awk '{print $2}')
            echo "Attempt $i: Status=$STATUS"
            if [ "$STATUS" = "Ready" ]; then
              SUCCESS=1
              break
            fi
            sleep ${{ env.HEALTH_SLEEP }}
          done
          if [ "$SUCCESS" -ne 1 ]; then
            echo "❌ EB environment not Ready"
            exit 1
          fi

      - name: Deploy to EB with retries
        run: |
          RETRIES=3
          for i in $(seq 1 $RETRIES); do
            echo "🚀 Deployment attempt $i"
            if eb deploy $EB_ENV --staged --timeout 20; then
              echo "✅ Deployment succeeded"
              break
            else
              echo "⚠️ Deployment failed, retrying in 15s"
              sleep 15
            fi
          done

      - name: Wait for health Green
        run: |
          SUCCESS=0
          for i in $(seq 1 ${{ env.MAX_HEALTH_RETRIES }}); do
            HEALTH=$(eb status $EB_ENV | grep "Health:" | awk '{print $2}')
            echo "Attempt $i: Health=$HEALTH"
            if [ "$HEALTH" = "Green" ]; then
              SUCCESS=1
              break
            fi
            sleep ${{ env.HEALTH_SLEEP }}
          done
          if [ "$SUCCESS" -ne 1 ]; then
            echo "❌ EB environment not Green"
            exit 1
          fi

  smoke:
    name: Run Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine EB CNAME
        id: env-url
        run: |
          CNAME=$(aws elasticbeanstalk describe-environments --environment-names ${{ needs.deploy.outputs.EB_ENV }} --query 'Environments[0].CNAME' --output text)
          if [ -z "$CNAME" ] || [ "$CNAME" = "None" ]; then
            echo "❌ Could not fetch CNAME"
            exit 1
          fi
          echo "TARGET_URL=https://$CNAME" >> $GITHUB_ENV

      - name: Run smoke script with retries
        run: |
          SUCCESS=0
          for i in $(seq 1 ${{ env.MAX_SMOKE_RETRIES }}); do
            echo "Attempt $i: Running smoke test"
            if node scripts/post_deploy_smoke.js; then
              echo "✅ Smoke test passed"
              SUCCESS=1
              break
            else
              echo "⚠️ Smoke test failed, retrying in ${{ env.SMOKE_SLEEP }}s"
              sleep ${{ env.SMOKE_SLEEP }}
            fi
          done
          if [ "$SUCCESS" -ne 1 ]; then
            echo "❌ Smoke test failed after retries"
            exit 1
          fi
