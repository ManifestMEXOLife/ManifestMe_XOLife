name: Full CI/CD Orchestrator (Robust)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment for deployment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip tests before deployment'
        required: false
        default: false
        type: boolean

jobs:
  verify-secrets:
    name: Verify Repository Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          echo "🔍 Verifying required repository secrets..."
          missing=false
          required_secrets=(
            "AWS_ACCESS_KEY_ID"
            "AWS_SECRET_ACCESS_KEY"
            "AWS_REGION"
            "EB_APP_NAME_STAGING"
            "EB_ENV_NAME_STAGING"
            "EB_APP_NAME"
            "EB_ENV_NAME"
            "SMOKE_TEST_EMAIL"
            "SMOKE_TEST_PASSWORD"
            "CODECOV_TOKEN"
            "SNYK_TOKEN"
          )
          for s in "${required_secrets[@]}"; do
            if [ -z "${{ secrets[$s] }}" ]; then
              echo "❌ Missing secret: $s"
              missing=true
            else
              echo "✅ Found secret: $s"
            fi
          done
          if [ "$missing" = true ]; then
            echo "🚨 One or more secrets are missing. Aborting."
            exit 1
          fi

  ci:
    name: Run CI Pipeline
    runs-on: ubuntu-latest
    needs: verify-secrets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint || echo "No lint script found"

      - name: Type check
        run: npx tsc --noEmit

      - name: Generate Prisma client
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate --schema prisma/schema.prisma
          fi

      - name: Run tests
        if: ${{ !inputs.skip_tests }}
        run: npm run test:cjs -- --passWithNoTests --coverage

      - name: Upload coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            npx codecov -t "$CODECOV_TOKEN"
          fi

      - name: Run Security Scan
        run: |
          npm audit --audit-level=moderate
          npx snyk test --severity-threshold=high || echo "Snyk scan failed but continuing"

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            coverage/
            test-results/
          retention-days: 7

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build || npx tsc

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: |
            dist/
            prisma/
            package.json
            package-lock.json
          retention-days: 7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_OIDC_ROLE_ARN_STAGING }}
          audience: sts.amazonaws.com
          output-env-credentials: true

      - name: Deploy to Elastic Beanstalk
        run: |
          ENV_NAME="${{ inputs.environment == 'production' && secrets.EB_ENV_NAME || secrets.EB_ENV_NAME_STAGING }}"
          APP_NAME="${{ inputs.environment == 'production' && secrets.EB_APP_NAME || secrets.EB_APP_NAME_STAGING }}"
          eb init $APP_NAME --region ${{ secrets.AWS_REGION }} --platform "Node.js 22 running on 64bit Amazon Linux 2023"
          eb setenv PORT=8080 || true
          eb deploy $ENV_NAME --staged --timeout 20

      - name: Wait for Environment Health
        run: |
          ENV_NAME="${{ inputs.environment == 'production' && secrets.EB_ENV_NAME || secrets.EB_ENV_NAME_STAGING }}"
          MAX_RETRIES=40
          SLEEP=15
          SUCCESS=0
          for i in $(seq 1 $MAX_RETRIES); do
            STATUS=$(eb status $ENV_NAME | grep "Health:" | awk '{print $2}')
            echo "Attempt $i: Health=$STATUS"
            if [ "$STATUS" = "Green" ]; then
              SUCCESS=1
              break
            fi
            sleep $SLEEP
          done
          if [ "$SUCCESS" -ne 1 ]; then
            echo "❌ Environment health did not become Green"
            exit 1
          fi

  smoke-test:
    name: Run Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Determine environment URL
        run: |
          if [ "${{ inputs.environment }}" == "staging" ]; then
            EB_ENV_NAME=${{ secrets.EB_ENV_NAME_STAGING }}
          else
            EB_ENV_NAME=${{ secrets.EB_ENV_NAME }}
          fi
          CNAME=$(aws elasticbeanstalk describe-environments --environment-names "$EB_ENV_NAME" --query 'Environments[0].CNAME' --output text)
          echo "TARGET_URL=https://$CNAME" >> $GITHUB_ENV

      - name: Run smoke tests with retries
        env:
          TARGET_URL: ${{ env.TARGET_URL }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: |
          MAX_RETRIES=5
          SLEEP=10
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i: Running smoke tests..."
            if node scripts/post_deploy_smoke.js; then
              echo "✅ Smoke tests passed!"
              exit 0
            else
              echo "⚠️ Smoke tests failed. Retrying in $SLEEP seconds..."
              sleep $SLEEP
            fi
          done
          echo "❌ Smoke tests failed after $MAX_RETRIES attempts"
          exit 1

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: smoke-test
    if: always()
    steps:
      - name: Notify
        run: |
          if [ "${{ needs.smoke-test.result }}" == "success" ]; then
            echo "✅ Full pipeline completed successfully!"
          else
            echo "❌ Full pipeline failed!"
            exit 1
