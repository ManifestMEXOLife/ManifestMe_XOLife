deploy:
  name: Deploy Application
  runs-on: ubuntu-latest
  needs: database-migration
  if: always() && (needs.database-migration.result == 'success' || inputs.skip_tests)
  environment: ${{ inputs.deploy_environment }}
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build || npx tsc

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ${{ env.AWS_REGION }}
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN || secrets.AWS_OIDC_ROLE_ARN_STAGING }}
        audience: sts.amazonaws.com
        output-env-credentials: true

    - name: Setup Python for EB CLI
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install EB CLI
      run: pip install --upgrade awsebcli

    - name: Deploy to Elastic Beanstalk
      id: deploy
      run: |
        # Select environment based on input
        if [ "${{ inputs.deploy_environment }}" == "production" ]; then
          ENV_NAME=${{ env.PRODUCTION_ENV }}
        else
          ENV_NAME=${{ env.STAGING_ENV }}
        fi

        echo "Deploying to EB environment: $ENV_NAME"
        eb init ${{ env.EB_APP_NAME }} \
          --region ${{ env.AWS_REGION }} \
          --platform "Node.js 22 running on 64bit Amazon Linux 2023"

        # Ensure PORT is set
        eb setenv PORT=8080 || true

        # Deploy application
        eb deploy $ENV_NAME --staged --timeout 20

        # Save EB CNAME for downstream jobs
        CNAME=$(aws elasticbeanstalk describe-environments \
          --environment-names "$ENV_NAME" \
          --query 'Environments[0].CNAME' --output text)
        echo "environment-url=https://$CNAME" >> $GITHUB_OUTPUT

    - name: Wait for EB environment to be healthy
      run: |
        ENV_NAME=${{ inputs.deploy_environment == 'production' && env.PRODUCTION_ENV || env.STAGING_ENV }}
        echo "Waiting for $ENV_NAME to become healthy..."
        MAX_RETRIES=40
        SLEEP=15
        SUCCESS=0
        for i in $(seq 1 $MAX_RETRIES); do
          STATUS=$(eb status $ENV_NAME | grep "Health:" | awk '{print $2}')
          echo "Attempt $i: Environment health status = $STATUS"
          if [ "$STATUS" = "Green" ]; then
            SUCCESS=1
            break
          fi
          sleep $SLEEP
        done
        if [ "$SUCCESS" -ne 1 ]; then
          echo "❌ Environment health did not become Green after $((MAX_RETRIES*SLEEP)) seconds"
          exit 1
        fi
        echo "✅ Environment health is Green!"
